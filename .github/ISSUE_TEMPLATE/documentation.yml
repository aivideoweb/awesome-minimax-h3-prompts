name: Documentation issue
description: Report unclear, incorrect, outdated, or broken repository documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Page or link
      placeholder: docs/api-workflow.md or a full URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
      description: Quote only the minimum text needed to identify the issue.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Suggested correction and source
      description: For model or API facts, include a primary MiniMax source.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no credentials or private information.
          required: true
